<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paw Partner Tunisia - Home</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #fdfdfd; }
        header { background: #fff; border-bottom: 1px solid #eee; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.5rem; font-weight: bold; color: #f39c12; text-decoration: none; }
        nav a { margin-left: 1.5rem; text-decoration: none; color: #333; font-weight: 500; }
        .hero { 
            position: relative;
            background: url('/static/images/hero-bg.jpg') no-repeat center center;
            background-size: cover;
            height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
        }
        .hero::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }
        .hero .container {
            position: relative;
            z-index: 2;
            max-width: 800px;
            padding: 0 20px;
        }
        .hero h1 { font-size: 3rem; margin-bottom: 2rem; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .cta-group { display: flex; gap: 2rem; justify-content: center; flex-wrap: wrap; }
        .cta-button { 
            padding: 1.2rem 2.5rem;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            transition: transform 0.2s, background 0.2s;
        }
        .cta-primary { background: #f39c12; color: white; }
        .cta-primary:hover { background: #e67e22; transform: translateY(-2px); }
        .cta-secondary { background: white; color: #333; }
        .cta-secondary:hover { background: #f0f0f0; transform: translateY(-2px); }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo">Paw Partner Tunisia</a>
        <nav>
            <a href="/find-care">Find Care</a>
            <a href="/offer-care">Offer Care</a>
        </nav>
    </header>

    <div class="hero">
        <div class="container">
            <h1>Find trusted pet boarding services near you in Tunisia.</h1>
            <div class="cta-group">
                <a href="/find-care" class="cta-button cta-primary">I'm looking to accommodate my pet</a>
                <a href="/offer-care" class="cta-button cta-secondary">I offer pet care services</a>
            </div>
        </div>
    </div>
</body>
</html>
