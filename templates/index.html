<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safepaws - A safe home for every pet</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #fdfdfd; }
        header { background: #fff; border-bottom: 1px solid #eee; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo-container { display: flex; align-items: center; gap: 0.8rem; text-decoration: none; }
        .logo-img { width: 40px; height: 40px; border-radius: 8px; }
        .logo-text { font-size: 1.5rem; font-weight: bold; color: #f39c12; }
        nav a { margin-left: 1.5rem; text-decoration: none; color: #333; font-weight: 500; }
        .hero { 
            position: relative;
            background: url('/static/images/hero-bg.jpg') no-repeat center center;
            background-size: cover;
            height: 650px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
        }
        .hero::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.6));
            z-index: 1;
        }
        .hero .container {
            position: relative;
            z-index: 2;
            max-width: 900px;
            padding: 0 20px;
        }
        .hero h1 { font-size: 3.5rem; margin-bottom: 1rem; text-shadow: 0 2px 10px rgba(0,0,0,0.3); line-height: 1.2; }
        .tagline { font-size: 1.5rem; margin-bottom: 3rem; opacity: 0.95; font-weight: 300; }
        .cta-group { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; }
        .cta-button { 
            padding: 1.2rem 2.8rem;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .cta-primary { background: #f39c12; color: white; border: 2px solid #f39c12; }
        .cta-primary:hover { background: #e67e22; border-color: #e67e22; transform: scale(1.05); }
        .cta-secondary { background: rgba(255,255,255,0.1); color: white; border: 2px solid white; backdrop-filter: blur(5px); }
        .cta-secondary:hover { background: white; color: #333; transform: scale(1.05); }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo-container">
            <img src="/static/images/logo.png" alt="Safepaws Logo" class="logo-img">
            <span class="logo-text">Safepaws</span>
        </a>
        <nav>
            <a href="/">Home</a>
            <a href="/find-care">Find Care</a>
            <a href="/offer-care">Offer Care</a>
            <a href="/login">Login</a>
            <a href="/register">Register</a>
        </nav>
    </header>

    <div class="hero">
        <div class="container">
            <h1>Find trusted pet care for my pet</h1>
            <p class="tagline">A safe home for every pet.</p>
            <div class="cta-group">
                <a href="/find-care" class="cta-button cta-primary">Find trusted pet care for my pet</a>
                <a href="/offer-care" class="cta-button cta-secondary">I offer pet care services</a>
            </div>
        </div>
    </div>
</body>
</html>
