<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title_register">Register - SafePaws</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { margin: 0; font-family: "Manrope", "Trebuchet MS", sans-serif; background: linear-gradient(180deg, rgba(255,250,243,0.95), rgba(255,255,255,0.95)), url('/static/images/boarding-1.jpg') center/cover no-repeat; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-card { background: rgba(255,255,255,0.92); padding: 2.6rem; border-radius: 16px; box-shadow: 0 18px 40px rgba(0,0,0,0.12); border: 1px solid rgba(243,156,18,0.18); width: 100%; max-width: 460px; text-align: center; backdrop-filter: blur(6px); }
        .logo-container { display: flex; align-items: center; gap: 0.8rem; text-decoration: none; justify-content: center; margin-bottom: 2rem; }
        .logo-img { width: 42px; height: 42px; border-radius: 10px; }
        .logo-text { font-size: 1.6rem; font-weight: bold; color: #f39c12; }
        h1 { color: #1f2a37; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.2rem; text-align: left; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #374151; font-size: 0.9rem; }
        .form-group input, .form-group select { width: 100%; padding: 0.85rem; border: 1px solid #e6d6b3; border-radius: 10px; box-sizing: border-box; font-size: 1rem; background: rgba(255,255,255,0.98); }
        .btn-primary { background: #f39c12; color: white; padding: 1rem 2rem; border-radius: 999px; font-weight: bold; border: none; width: 100%; cursor: pointer; font-size: 1rem; margin-top: 1rem; }
        .footer-link { margin-top: 1.5rem; font-size: 0.9rem; }
        .footer-link a { color: #f39c12; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
<div class="lang-switcher auth-lang">
  <label class="sr-only" data-i18n="lang_label">Language</label>
  <select class="lang-switcher-select">
    <option value="en">EN</option>
    <option value="fr">FR</option>
    <option value="ar">AR</option>
  </select>
</div>

<div class="auth-card">
    <a href="/" class="logo-container">
        <img src="/static/images/logo.png" alt="SafePaws Logo" class="logo-img">
        <span class="logo-text">SafePaws</span>
    </a>

    <h1 data-i18n="register_title">Create Account</h1>

    <form id="registerForm">
        <div class="form-group">
            <label data-i18n="register_role_label">I am a...</label>
            <select id="role" required>
                <option value="owner" data-i18n="register_role_owner">Pet Owner</option>
                <option value="provider" data-i18n="register_role_provider">Care Provider</option>
            </select>
        </div>

        <div class="form-group">
            <label data-i18n="register_name">Full Name</label>
            <input type="text" id="name" required>
        </div>

        <div class="form-group">
            <label data-i18n="register_email">Email</label>
            <input type="email" id="email" required>
        </div>

        <div class="form-group">
            <label data-i18n="register_password">Password</label>
            <input type="password" id="password" required>
        </div>

    

    <button class="btn-primary" type="submit" data-i18n="register_btn">Register</button>
    </form>

    <p id="msg"></p>

    <div class="footer-link">
        <span data-i18n="register_login_hint">Already have an account?</span> <a href="/login" data-i18n="nav_login">Login</a>
    </div>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", async e => {
    e.preventDefault();

    const role = document.getElementById("role").value;
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const endpoint =
        role === "owner"
            ? "/owner/register"
            : "/provider/register";

    const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, password })
    });

    const msg = document.getElementById("msg");

    if (!res.ok) {
        const err = await res.json().catch(() => null);
        msg.textContent = "❌ Registration failed" + (err && err.msg ? (": " + err.msg) : '');
        return;
    }

    msg.textContent = "✅ Registered! Redirecting to login...";
    setTimeout(() => window.location.href = "/login", 1200);
});
</script>


    <script src="/static/js/i18n.js"></script>
</body>
</html>
