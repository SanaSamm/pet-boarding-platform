<div class="card card-soft">
  <h2 data-i18n="pets_create_title">Add Pet</h2>

  <form id="petForm">
    <input placeholder="Pet name" data-i18n-placeholder="pets_create_name" id="name" required />
    <input placeholder="Type (dog/cat)" data-i18n-placeholder="pets_create_type" id="type" required />
    <input type="number" placeholder="Age" data-i18n-placeholder="pets_create_age" id="age" required />
    <button class="btn-primary" type="submit" data-i18n="pets_create_submit">Add Pet</button>
  </form>

  <div style="margin-top:1rem;">
    <button id="backHomeBtn" class="back-button" type="button" data-i18n="common_back">Back to Home</button>
  </div>
</div>

<script>
const form = document.getElementById("petForm");
const nameEl = document.getElementById("name");
const typeEl = document.getElementById("type");
const ageEl = document.getElementById("age");
const backHome = document.getElementById("backHomeBtn");

if (backHome) backHome.addEventListener("click", () => { window.location.href = "/"; });

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const token = localStorage.getItem("access_token");
  if (!token) {
    alert(window.I18N ? window.I18N.t("common_login_required") : "Please login to add a pet.");
    window.location.href = "/login";
    return;
  }

  const payload = {
    name: nameEl.value.trim(),
    type: typeEl.value.trim(),
    age: Number(ageEl.value)
  };

  try {
    const res = await fetch("/pets", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      let errBody = {};
      try { errBody = await res.json(); } catch(e) {}
      const detail = errBody.message || errBody.messages || JSON.stringify(errBody) || res.statusText;
      const msg = (window.I18N ? window.I18N.t("pets_create_failed") : "Failed to create pet") + ": " + detail;
      alert(msg);
      return;
    }

    alert(window.I18N ? window.I18N.t("pets_create_success") : "Pet created!");
    form.reset();
    // redirect to my pets
    setTimeout(() => { window.location.href = "/my-pets"; }, 600);

  } catch (err) {
    console.error(err);
    alert(window.I18N ? window.I18N.t("common_network_error") : "Network error");
  }
});
</script>
