<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-i18n="title_community">Community Chat</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <header>
      <a href="/" class="logo-container">
        <img src="/static/images/logo.png" class="logo-img">
        <span class="logo-text">SafePaws</span>
      </a>
      <nav class="header-actions">
        <a href="/messages" data-i18n="nav_messages">Messages</a>
        <a href="/login" id="loginLink" data-i18n="nav_login">Login</a>
            <div class="lang-switcher">
        <label class="sr-only" data-i18n="lang_label">Language</label>
        <select class="lang-switcher-select">
            <option value="en">EN</option>
            <option value="fr">FR</option>
            <option value="ar">AR</option>
        </select>
    </div>
        <div id="userMenu" class="user-menu"></div>
      </nav>
    </header>
    <div class="container">
      <h1 style="text-align:center; margin-top:1rem" data-i18n="community_title">Pet Owners Community</h1>

      <div class="card-soft" style="max-width:900px; margin:1.6rem auto; padding:0; overflow:hidden;">
        <section class="thread" style="height: 64vh; display:flex; flex-direction:column; padding:0.8rem;">
          <div class="messages-area" id="messagesArea">Loading…</div>

          <form id="sendForm" class="message-input" style="margin-top:10px;">
            <input type="text" id="messageInput" placeholder="Share with the community" data-i18n-placeholder="community_placeholder" autocomplete="off" />
            <button type="submit" data-i18n="common_send">Send</button>
          </form>
        </section>
      </div>
    </div>

    <script src="/static/js/community.js"></script>
    <script src="/static/js/user_menu.js"></script>
      <script src="/static/js/i18n.js"></script>
</body>
</html>
