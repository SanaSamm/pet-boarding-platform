<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title_login">Login - SafePaws</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { margin: 0; font-family: "Manrope", "Trebuchet MS", sans-serif; background: linear-gradient(180deg, rgba(255,250,243,0.95), rgba(255,255,255,0.95)), url('/static/images/boarding-2.jpg') center/cover no-repeat; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-card { background: rgba(255,255,255,0.92); padding: 2.6rem; border-radius: 16px; box-shadow: 0 18px 40px rgba(0,0,0,0.12); border: 1px solid rgba(243,156,18,0.18); width: 100%; max-width: 420px; text-align: center; backdrop-filter: blur(6px); }
        .logo-container { display: flex; align-items: center; gap: 0.8rem; text-decoration: none; justify-content: center; margin-bottom: 2rem; }
        .logo-img { width: 42px; height: 42px; border-radius: 10px; }
        .logo-text { font-size: 1.6rem; font-weight: bold; color: #f39c12; }
        h1 { color: #1f2a37; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.2rem; text-align: left; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #374151; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 0.85rem; border: 1px solid #e6d6b3; border-radius: 10px; box-sizing: border-box; font-size: 1rem; background: rgba(255,255,255,0.98); }
        .btn-primary { background: #f39c12; color: white; padding: 1rem 2rem; border-radius: 999px; font-weight: bold; border: none; width: 100%; cursor: pointer; font-size: 1rem; margin-top: 1rem; }
        .note { margin-top: 1.2rem; font-size: 0.85rem; color: #6b7280; }
        .footer-link { margin-top: 1.5rem; font-size: 0.9rem; }
        .footer-link a { color: #f39c12; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
<div class="lang-switcher auth-lang">
  <label class="sr-only" data-i18n="lang_label">Language</label>
  <select class="lang-switcher-select">
    <option value="en">EN</option>
    <option value="fr">FR</option>
    <option value="ar">AR</option>
  </select>
</div>
  <div class="auth-card">
    <a href="/" class="logo-container">
      <img src="/static/images/logo.png" alt="SafePaws Logo" class="logo-img">
      <span class="logo-text">SafePaws</span>
    </a>

    <h1 data-i18n="login_title">Login</h1>

    <form id="loginForm">
      <div class="form-group">
        <label data-i18n="login_email">Email</label>
        <input type="email" id="email" placeholder="email@example.com" data-i18n-placeholder="login_email" required>
      </div>

      <div class="form-group">
        <label data-i18n="login_password">Password</label>
        <input type="password" id="password" placeholder="" data-i18n-placeholder="login_password"••••••••" required>
      </div>

      <button class="btn-primary" type="submit" data-i18n="login_btn">Login</button>
    </form>

    <p class="note"><span data-i18n="login_note">Authentication handled via secure API (JWT)</span></p>
    <p id="msg"></p>

    <div class="footer-link">
      <span data-i18n="login_register_hint">Don't have an account?</span>
      <a href="/register" data-i18n="nav_register">Register</a>
    </div>
  </div>

<script>
document.getElementById("loginForm").addEventListener("submit", async e => {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const msg = document.getElementById("msg");

  // Try OWNER login first
  let res = await fetch("/owner/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  });

  // If not owner, try provider
  if (!res.ok) {
    res = await fetch("/provider/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
  }

  if (!res.ok) {
    msg.textContent = "❌ Invalid email or password";
    return;
  }

  const data = await res.json();

  // ✅ STORE JWT
  localStorage.setItem("access_token", data.access_token);

  msg.textContent = "✅ Logged in! Redirecting...";

  // Prefer server-provided next URL when available (recommended)
  if (data.next) {
    window.location.href = data.next;
    return;
  }

  try {
    const payload = JSON.parse(atob(data.access_token.split(".")[1]));
    // Role is now stored as a top-level claim (payload.role). Fallback to older structure if present.
    const role = payload.role || (payload.sub && payload.sub.role);

    if (role === "owner") {
      window.location.href = "/my-pets";
    } else if (role === "provider") {
      // Redirect providers to their profile page using the token's subject (sub)
      const providerId = payload.sub || payload.id || payload.user_id;
      if (providerId) {
        window.location.href = `/provider?id=${encodeURIComponent(providerId)}`;
      } else {
        // Fallback to offering a service if no id present
        window.location.href = "/offer-care";
      }
    } else {
      // Unknown role: fallback to home
      window.location.href = "/";
    }
  } catch (e) {
    // If parsing fails, fallback gracefully
    window.location.href = "/";
  }

});
</script>

    <script src="/static/js/i18n.js"></script>
</body>

</html>
