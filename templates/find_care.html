<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title_find">Find Care - SafePaws</title>
    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        .hero-search {
            background: url('/static/images/hero-bg.jpg') no-repeat center;
            background-size: cover;
            padding: 6rem 2rem;
            color: white;
            text-align: center;
        }

        .search-container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 2rem;
            border-radius: 12px;
        }

        .filters {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        /* FIX: labels were white on white */
        .filter-group label {
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 0.3rem;
            font-size: 0.9rem;
        }

        .filter-group input[type="text"] {
            padding: 0.7rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            min-width: 200px;
        }

        .filter-group input[type="range"] {
            width: 160px;
        }

        .services-grid {
            max-width: 1200px;
            margin: 3rem auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .service-card {
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 1.5rem;
            background: white;
        }
        .service-card-media {
            width: 100%;
            height: 160px;
            border-radius: 10px;
            overflow: hidden;
            background: #fff7ea;
            margin-bottom: 0.8rem;
        }
        .service-card-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .price {
            font-weight: bold;
            color: #f39c12;
        }

        .btn-search {
            background: #f39c12;
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            margin-top: 0.5rem;
        }

        .btn-search:hover {
            background: #e67e22;
        }
    </style>
</head>

<body>

<header>
    <a href="/" class="logo-container">
        <img src="/static/images/logo.png" class="logo-img">
        <span class="logo-text">SafePaws</span>
    </a>
    <nav class="header-actions">
        <a href="/messages" data-i18n="nav_messages">Messages</a>
        <a href="/login" id="loginLink" data-i18n="nav_login">Login</a>
            <div class="lang-switcher">
        <label class="sr-only" data-i18n="lang_label">Language</label>
        <select class="lang-switcher-select">
            <option value="en">EN</option>
            <option value="fr">FR</option>
            <option value="ar">AR</option>
        </select>
    </div>
        <div id="userMenu" class="user-menu"></div>
    </nav>
</header>

<div class="hero-search">
    <div class="search-container">
        <h2 data-i18n="find_title">Search for Pet Care</h2>

        <div class="filters">
            <div class="filter-group">
                <label for="locationInput" data-i18n="common_location">Location</label>
                <input type="text" id="locationInput" placeholder="e.g. Tunis, Sousse" data-i18n-placeholder="find_location_placeholder">
            </div>

            <div class="filter-group">
                <label for="priceRange">
                    <span data-i18n="find_price_label">Max Price</span>: <span id="priceValue">100</span> <span data-i18n="common_price_unit">TND/day</span>
                </label>
                <input type="range" id="priceRange" min="10" max="200" value="100">
            </div>

            <div class="filter-group">
                <label>
                    <input type="checkbox" disabled>
                    <span data-i18n="find_available_only">Available only</span>
                </label>
            </div>

            <button class="btn-search" id="searchBtn" data-i18n="common_search">Search</button>
            <button class="btn-search" id="findNearestBtn" style="background:#2ecc71; margin-left:8px;" data-i18n="common_find_nearest">Find nearest providers</button>
        </div>
    </div>
</div>

<section class="concierge">
    <div class="concierge-card">
        <div class="concierge-header">
            <div class="concierge-avatar">
                <img src="/static/images/logo.png" alt="SafePaws logo">
            </div>
            <div>
                <h3 data-i18n="concierge_title">AI Care Concierge</h3>
                <p><span data-i18n="concierge_subtitle">Ask for grooming, boarding, or nearby care in Tunisia - I'll find providers fast.</span></p>
            </div>
        </div>
        <div class="concierge-inputs">
            <input type="text" id="conciergeInput" placeholder="e.g. grooming in Tunis under 40 TND" data-i18n-placeholder="concierge_placeholder">
            <button id="conciergeBtn" data-i18n="concierge_ask">Ask</button>
        </div>
        <div id="conciergeThread" class="concierge-thread"></div>
        <div id="conciergeResults" class="concierge-results"></div>
    </div>
</section>

<div class="services-grid" id="servicesGrid"></div>

<script>
const priceRange = document.getElementById("priceRange");
const priceValue = document.getElementById("priceValue");
const locationInput = document.getElementById("locationInput");
const searchBtn = document.getElementById("searchBtn");
const servicesGrid = document.getElementById("servicesGrid");

/* Slider value updates */
priceRange.addEventListener("input", e => {
    priceValue.textContent = e.target.value;
});

async function fetchServices() {
    const maxPrice = priceRange.value;
    const location = locationInput.value.trim();

    let url = `/services?max_price=${maxPrice}`;
    if (location) {
        url += `&location=${encodeURIComponent(location)}`;
    }

    try {
        const res = await fetch(url);
        const services = await res.json();
        renderServices(services);
    } catch (err) {
        console.error(err);
        servicesGrid.innerHTML = "<p>" + (window.I18N ? window.I18N.t("find_services_failed") : "Failed to load services.") + "</p>";
    }
}

function renderServices(services) {
    servicesGrid.innerHTML = "";

    if (!services.length) {
        servicesGrid.innerHTML = "<p>" + (window.I18N ? window.I18N.t("find_services_empty") : "No services match your filters.") + "</p>";
        return;
    }

    services.forEach(service => {
        const card = document.createElement("div");
        card.className = "service-card";

        const distanceHtml = service.distance_km != null
            ? `<p>${service.distance_km.toFixed(2)} ${(window.I18N ? window.I18N.t("common_km_away") : "km away")}</p>`
            : "";

        const shortLoc = service.geocoded_short || service.geocoded_name || '';
        const photoUrl = service.photo_url || '';
        const imageHtml = photoUrl
            ? `<img src="${photoUrl}" alt="${service.name}">`
            : `<img src="/static/images/boarding-1.jpg" data-random-pet alt="${service.name}">`;

        card.innerHTML = `
            <div class="service-card-media">${imageHtml}</div>
            <h3>${service.name}</h3>
            <p>${(window.I18N ? window.I18N.t("common_location") : "Location")}: ${service.location}${shortLoc ? ` - <small title="${service.geocoded_name || ''}">${shortLoc}</small>` : ""}</p>
            ${distanceHtml}
            <p class="price">${service.price_per_day ?? (window.I18N ? window.I18N.t("common_price_na") : "N/A")} ${(window.I18N ? window.I18N.t("common_price_unit") : "TND/day")}</p>

            <a class="btn-search" href="/service-details?id=${service.id}">
                ${(window.I18N ? window.I18N.t("common_details") : "Details")}
            </a>
        `;

        const imgEl = card.querySelector('img[data-random-pet]');
        if (imgEl && window.loadRandomPetImage) {
            window.loadRandomPetImage(imgEl);
        }

        servicesGrid.appendChild(card);
    });
}

searchBtn.addEventListener("click", fetchServices);

const findNearestBtn = document.getElementById('findNearestBtn');
if (findNearestBtn) {
    findNearestBtn.addEventListener('click', () => {
        if (!navigator.geolocation) {
            alert(window.I18N ? window.I18N.t('find_geo_unsupported') : 'Geolocation is not supported by your browser');
            return;
        }
        findNearestBtn.disabled = true;
        const originalText = findNearestBtn.textContent;
        findNearestBtn.textContent = window.I18N ? window.I18N.t('common_locating') : 'Locating...';

        const tryGetLocation = (options) => new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, options);
        });

        (async () => {
            let lat, lng;

            // First try quick low-accuracy attempt
            try {
                const pos = await tryGetLocation({ enableHighAccuracy: false, timeout: 10000 });
                lat = pos.coords.latitude;
                lng = pos.coords.longitude;
            } catch (e1) {
                console.warn('Low-accuracy attempt failed:', e1 && e1.message);
                try {
                    const pos = await tryGetLocation({ enableHighAccuracy: true, timeout: 20000 });
                    lat = pos.coords.latitude;
                    lng = pos.coords.longitude;
                } catch (e2) {
                    console.error('Geolocation failed:', e2 && e2.message);
                    alert('Unable to retrieve your location: ' + (e2 && e2.message ? e2.message : 'error') + '. Please try again or enter a location manually.');
                    findNearestBtn.disabled = false;
                    findNearestBtn.textContent = originalText;
                    return;
                }
            }

            try {
                const res = await fetch(`/services?nearby=true&lat=${lat}&lng=${lng}&max_price=${priceRange.value}`);
                if (!res.ok) throw new Error('Failed to load nearby services');
                const services = await res.json();
                renderServices(services);
            } catch (err) {
                console.error(err);
                alert(window.I18N ? window.I18N.t('find_nearby_failed') : 'Failed to fetch nearby services.');
            } finally {
                findNearestBtn.disabled = false;
                findNearestBtn.textContent = originalText;
            }
        })();
    });
}

/* Load services on page load */
fetchServices();
</script>
<script src="/static/js/ai_concierge.js"></script>
<script src="/static/js/pet_images.js"></script>
<script src="/static/js/user_menu.js"></script>

    <script src="/static/js/i18n.js"></script>
</body>
</html>
