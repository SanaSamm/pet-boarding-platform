<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Care - Paw Partner Tunisia</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        header { background: #fff; border-bottom: 1px solid #eee; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: bold; color: #f39c12; text-decoration: none; }
        nav a { margin-left: 1.5rem; text-decoration: none; color: #333; font-weight: 500; }
        .content { padding: 2rem; max-width: 1200px; margin: 0 auto; }
        h1 { color: #2c3e50; }
        #map { height: 600px; width: 100%; border-radius: 12px; margin-top: 1rem; }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo">Paw Partner Tunisia</a>
        <nav>
            <a href="/find-care">Find Care</a>
            <a href="/offer-care">Offer Care</a>
        </nav>
    </header>
    <div class="content">
        <h1>Available Pet Boarding Services</h1>
        <p>Browse trusted pet sitters and boarding facilities across Tunisia.</p>
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        const map = L.map('map').setView([33.8869, 9.5375], 6);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19, attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        async function loadServices() {
            try {
                const response = await fetch('/services');
                const data = await response.json();
                data.forEach(service => {
                    if (service.latitude && service.longitude) {
                        L.marker([service.latitude, service.longitude]).addTo(map)
                            .bindPopup(`<strong>${service.name}</strong><br>Price: ${service.price_per_day} TND/day`);
                    }
                });
            } catch (e) { console.error(e); }
        }
        loadServices();
    </script>
</body>
</html>
